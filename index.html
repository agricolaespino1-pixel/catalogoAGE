<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--c:#2f6b4f}*{box-sizing:border-box}body{margin:auto;font:15px system-ui,sans-serif;background:#faf8f4;color:#222;max-width:900px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--c);color:#fff;position:sticky;top:0;z-index:5}
.lg{display:flex;align-items:center;gap:8px;font-size:18px}.lg img{height:34px;width:34px;border-radius:50%;object-fit:cover}
.ic{background:none;border:0;color:#fff;font-size:20px;position:relative;cursor:pointer}.ic i{position:absolute;top:-6px;right:-8px;background:#d33;font-size:11px;border-radius:9px;padding:1px 5px;font-style:normal}
.sr{width:calc(100% - 32px);margin:12px 16px;padding:11px 14px;border:1px solid #ddd;border-radius:24px}
.bn{margin:0 16px;height:170px;border-radius:16px;background:#d9e6dd center/cover;display:flex;align-items:flex-end;color:#fff}.bn div{padding:16px;background:linear-gradient(transparent,#0009);width:100%;border-radius:0 0 16px 16px}.bn h2{margin:0}.bn p{margin:4px 0 0}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}nav button{border:1px solid #ccc;background:#fff;border-radius:20px;padding:7px 16px;white-space:nowrap;cursor:pointer}nav .on{background:var(--c);color:#fff;border-color:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 16px 24px}
.card{background:#fff;border-radius:14px;padding:10px;box-shadow:0 1px 6px #0001;display:flex;flex-direction:column;gap:4px}.card h4{margin:2px 0;font-weight:500;font-size:14px}
.ph{aspect-ratio:1;border-radius:10px;background:#e8efe9 center/cover;display:grid;place-items:center;font-size:40px;color:var(--c);position:relative}.ph em{position:absolute;top:6px;left:6px;background:var(--c);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;font-style:normal}
button{font:inherit}.card button,.pr{background:var(--c);color:#fff;border:0;border-radius:10px;padding:9px;cursor:pointer;width:100%}.card button:disabled{background:#bbb}
.mb{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:9;padding:12px}.md{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.md input,.md select{width:100%;padding:9px;margin:4px 0 10px;border:1px solid #ccc;border-radius:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee}
.pn{padding:0 16px 24px}.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}.k div{background:#fff;padding:12px;border-radius:12px;box-shadow:0 1px 6px #0001}.k b{display:block;font-size:20px}
.cv{height:240px;background:#fff;border-radius:12px;padding:8px;margin-bottom:12px}.tw{overflow-x:auto;margin-top:10px}table{width:100%;border-collapse:collapse;background:#fff}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}th{background:#eef3ef}
.sm{padding:6px 11px;border:1px solid #ccc;background:#fff;border-radius:8px;cursor:pointer;color:#222}
</style></head><body><div id="app"></div><div id="m"></div>
<script>
// Pega aquí la URL de tu Apps Script (termina en /exec) para guardar en Google Sheets. Vacío = solo este navegador.
const API='https://script.google.com/macros/s/AKfycbwGUb6IG274GWp8ZMgVvNxn3bzlXPIoRkP6fBDrioKSqjMAh9eeIm3swUaksFJ3rw5g/exec';
const K='catalogo_v1',R={admin:['dash','prod','ped','ban','cfg','usr'],vendedor:['dash','ped'],bodega:['prod']};
const D={cfg:{name:'Mi Catálogo',logo:'',color:'#2f6b4f',wa:'51999999999',cur:'S/',btn:'Pedir por WhatsApp'},cats:['Frutas','Abonos','Servicios'],
prods:[{id:1,n:'Compost orgánico 25 kg',c:'Abonos',p:35,s:40,img:'',b:'Nuevo',st:'Activo'},{id:2,n:'Uva red globe 5 kg',c:'Frutas',p:48,s:25,img:'',b:'',st:'Activo'},{id:3,n:'Asesoría de cultivo',c:'Servicios',p:120,s:99,img:'',b:'Oferta',st:'Activo'}],
banners:[{t:'Calidad directa del campo',x:'Pide hoy y recibe en tu puerta',img:''}],orders:[],
users:[{u:'admin',p:'admin123',r:'admin'},{u:'vendedor',p:'1234',r:'vendedor'},{u:'bodega',p:'1234',r:'bodega'}]};
let S;try{S=JSON.parse(localStorage.getItem(K))||D}catch(e){S=D}
let cart={},cat='Todos',q='',me=null,tab='dash',bi=0;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Almacenamiento lleno: usa fotos más pequeñas')}
 if(API)fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify(S)}).catch(()=>{})}
function img(f,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const m=Math.min(1,700/i.width),c=document.createElement('canvas');c.width=i.width*m;c.height=i.height*m;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(f)}
function modal(h){$('#m').innerHTML=`<div class=mb onclick="if(event.target==this)cl()"><div class=md>${h}</div></div>`}
function cl(){$('#m').innerHTML=''}
function shop(){const c=S.cfg,n=Object.values(cart).reduce((a,b)=>a+b,0);document.documentElement.style.setProperty('--c',c.color);
$('#app').innerHTML=`<header><button class=ic onclick="login()">☰</button><div class=lg>${c.logo?`<img src="${c.logo}">`:''}<b>${esc(c.name)}</b></div><button class=ic onclick="cartOpen()">🛍<i>${n}</i></button></header>
<input class=sr placeholder="Buscar..." value="${esc(q)}" oninput="q=this.value.toLowerCase();grid()"><div id=bn></div>
<nav>${['Todos',...S.cats].map(x=>`<button class="${x==cat?'on':''}" onclick="cat=this.textContent;shop()">${esc(x)}</button>`).join('')}</nav><div class=grid id=grid></div>`;ban();grid()}
function ban(){const b=S.banners[bi%S.banners.length];if($('#bn'))$('#bn').innerHTML=b?`<div class=bn style="background-image:url(${b.img||''})"><div><h2>${esc(b.t)}</h2><p>${esc(b.x)}</p></div></div>`:''}
setInterval(()=>{bi++;ban()},4500);
function grid(){const l=S.prods.filter(p=>p.st!='Oculto'&&(cat=='Todos'||p.c==cat)&&p.n.toLowerCase().includes(q));
$('#grid').innerHTML=l.map(p=>`<div class=card><div class=ph style="background-image:url(${p.img||''})">${p.img?'':esc(p.n[0])}${p.b?`<em>${esc(p.b)}</em>`:''}</div><h4>${esc(p.n)}</h4><b>${S.cfg.cur}${p.p}</b><button ${p.s<1?'disabled':''} onclick="add(${p.id})">${p.s<1?'Agotado':'Agregar'}</button></div>`).join('')||'<p>No hay productos en esta categoría.</p>'}
function add(id){cart[id]=(cart[id]||0)+1;shop()}
function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<1)delete cart[id];shop();cartOpen()}
function items(){return Object.entries(cart).map(([id,q])=>({p:S.prods.find(x=>x.id==id),q})).filter(x=>x.p)}
function cartOpen(){const it=items(),t=it.reduce((a,x)=>a+x.p.p*x.q,0),c=S.cfg.cur;
modal(`<h3>Tu pedido</h3>${it.map(x=>`<div class=row><span>${esc(x.p.n)}</span><span><button class=sm onclick="chg(${x.p.id},-1)">−</button> ${x.q} <button class=sm onclick="chg(${x.p.id},1)">+</button></span><b>${c}${(x.p.p*x.q).toFixed(2)}</b></div>`).join('')||'<p>Agrega productos para armar tu pedido.</p>'}<h3>Total: ${c}${t.toFixed(2)}</h3><input id=cn placeholder="Tu nombre"><button class=pr onclick="send()">${esc(S.cfg.btn)}</button>`)}
async function send(){if(!items().length)return;const nm=$('#cn').value||'Cliente',c=S.cfg.cur;
 if(API)try{const n=await(await fetch(API)).json();if(n.prods)S=n}catch(e){}
 const it=items(),t=it.reduce((a,x)=>a+x.p.p*x.q,0);
 S.orders.push({id:Date.now(),d:new Date().toISOString().slice(0,10),cl:nm,items:it.map(x=>({n:x.p.n,q:x.q,p:x.p.p})),tot:t,est:'Nuevo'});
 it.forEach(x=>x.p.s=Math.max(0,x.p.s-x.q));
 const msg=`Hola, soy ${nm}. Mi pedido:\n`+it.map(x=>`• ${x.q}x ${x.p.n} — ${c}${x.p.p}`).join('\n')+`\nTotal: ${c}${t.toFixed(2)}`;
 window.open('https://wa.me/'+S.cfg.wa+'?text='+encodeURIComponent(msg));cart={};save();cl();shop()}
function login(){if(me)return admin();modal(`<h3>Panel administrativo</h3><input id=lu placeholder="Usuario"><input id=lp type=password placeholder="Contraseña"><button class=pr onclick="ok()">Ingresar</button>`)}
function ok(){const u=S.users.find(x=>x.u==$('#lu').value&&x.p==$('#lp').value);if(!u)return alert('Usuario o contraseña incorrectos');me=u;cl();admin()}
function admin(){const T={dash:'Dashboard',prod:'Productos',ped:'Pedidos',ban:'Banners',cfg:'Config',usr:'Usuarios'};if(!R[me.r].includes(tab))tab=R[me.r][0];
$('#app').innerHTML=`<header><button class=ic onclick="me=null;shop()">⏻</button><b>Panel · ${esc(me.u)}</b><button class=ic onclick="shop()">🏪</button></header><nav>${R[me.r].map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';admin()">${T[t]}</button>`).join('')}</nav><div class=pn>${V[tab]()}</div>`;if(tab=='dash')charts()}
const tbl=(h,r)=>`<div class=tw><table><tr>${h.map(x=>`<th>${x}`).join('')}${r}</table></div>`;
const V={
dash:()=>{const o=S.orders.filter(x=>x.est!='Anulado'),t=new Date().toISOString().slice(0,10),sum=a=>a.reduce((s,x)=>s+x.tot,0),c=S.cfg.cur;
return `<div class=k><div>Ventas hoy<b>${c}${sum(o.filter(x=>x.d==t)).toFixed(2)}</b></div><div>Ventas del mes<b>${c}${sum(o.filter(x=>x.d.startsWith(t.slice(0,7)))).toFixed(2)}</b></div><div>Pedidos<b>${o.length}</b></div><div>Ticket promedio<b>${c}${(o.length?sum(o)/o.length:0).toFixed(2)}</b></div><div>Stock bajo<b>${S.prods.filter(p=>p.s<5).length}</b></div></div><div class=cv><canvas id=c1></canvas></div><div class=cv><canvas id=c2></canvas></div><button class=sm onclick="xl()">⬇ Descargar Excel</button>`},
prod:()=>`<button class=sm onclick="ed('prods',-1,PF(),{id:Date.now(),st:'Activo',c:S.cats[0],s:0,p:0,b:''})">+ Nuevo producto</button>`+tbl(['Producto','Categoría','Precio','Stock','Estado',''],S.prods.map((p,i)=>`<tr><td>${esc(p.n)}<td>${esc(p.c)}<td>${p.p}<td style="color:${p.s<5?'#d33':'inherit'}">${p.s}<td>${p.st}<td><button class=sm onclick="ed('prods',${i},PF())">Editar</button> <button class=sm onclick="del('prods',${i})">✕</button>`).join('')),
ped:()=>`<button class=sm onclick="xl()">⬇ Descargar Excel</button>`+tbl(['Fecha','Cliente','Detalle','Total','Estado'],S.orders.slice().reverse().map(o=>`<tr><td>${o.d}<td>${esc(o.cl)}<td>${o.items.map(i=>i.q+'x '+esc(i.n)).join(', ')}<td>${S.cfg.cur}${o.tot.toFixed(2)}<td><select onchange="st(${o.id},this.value)">${['Nuevo','Confirmado','Entregado','Anulado'].map(e=>`<option ${e==o.est?'selected':''}>${e}`).join('')}</select>`).join('')),
ban:()=>`<button class=sm onclick="ed('banners',-1,BF(),{t:'',x:'',img:''})">+ Nuevo banner</button>`+tbl(['Título','Texto',''],S.banners.map((b,i)=>`<tr><td>${esc(b.t)}<td>${esc(b.x)}<td><button class=sm onclick="ed('banners',${i},BF())">Editar</button> <button class=sm onclick="del('banners',${i})">✕</button>`).join('')),
cfg:()=>`<button class=sm onclick="cfgEd()">Editar nombre, logo, colores y WhatsApp</button><p>Categorías: ${S.cats.map(esc).join(', ')}</p>`,
usr:()=>`<button class=sm onclick="ed('users',-1,UF(),{u:'',p:'',r:'vendedor'})">+ Nuevo usuario</button>`+tbl(['Usuario','Rol',''],S.users.map((u,i)=>`<tr><td>${esc(u.u)}<td>${u.r}<td><button class=sm onclick="ed('users',${i},UF())">Editar</button> <button class=sm onclick="del('users',${i})">✕</button>`).join(''))};
const PF=()=>[['n','Nombre','text'],['c','Categoría','select',S.cats],['p','Precio','number'],['s','Stock','number'],['b','Etiqueta (Nuevo, Oferta)','text'],['st','Estado','select',['Activo','Oculto']],['img','Foto','file']];
const BF=()=>[['t','Título','text'],['x','Texto','text'],['img','Imagen','file']],UF=()=>[['u','Usuario','text'],['p','Contraseña','text'],['r','Rol','select',['admin','vendedor','bodega']]];
function form(t,f,v,done){modal(`<h3>${t}</h3>${f.map(([k,l,ty,o])=>`<label>${l}${ty=='select'?`<select id=f_${k}>${o.map(x=>`<option ${x==v[k]?'selected':''}>${esc(x)}</option>`).join('')}</select>`:ty=='file'?`<input id=f_${k} type=file accept="image/*">`:`<input id=f_${k} type=${ty} value="${esc(v[k])}">`}</label>`).join('')}<button class=pr id=sv>Guardar</button>`);
$('#sv').onclick=async()=>{const r={};for(const[k,,ty]of f){const e=$('#f_'+k);r[k]=ty=='file'?(e.files[0]?await new Promise(y=>img(e.files[0],y)):v[k]||''):ty=='number'?+e.value:e.value}done(r);cl();save();admin()}}
function ed(key,i,f,def){const a=S[key];form(i>=0?'Editar':'Nuevo',f,i>=0?a[i]:def,r=>i>=0?Object.assign(a[i],r):a.push({...def,...r}))}
function cfgEd(){const f=[['name','Nombre del negocio','text'],['logo','Logo','file'],['color','Color principal','color'],['wa','WhatsApp (con código de país)','text'],['cur','Moneda','text'],['btn','Texto del botón','text'],['cats','Categorías (separadas por coma)','text']];
form('Configuración',f,{...S.cfg,cats:S.cats.join(',')},r=>{S.cats=r.cats.split(',').map(s=>s.trim()).filter(Boolean);delete r.cats;S.cfg=r})}
function del(k,i){if(confirm('¿Eliminar este registro?')){S[k].splice(i,1);save();admin()}}
function st(id,v){S.orders.find(o=>o.id==id).est=v;save()}
function charts(){const o=S.orders.filter(x=>x.est!='Anulado'),by={},tp={},op={maintainAspectRatio:false};o.forEach(x=>{by[x.d]=(by[x.d]||0)+x.tot;x.items.forEach(i=>tp[i.n]=(tp[i.n]||0)+i.q)});
const ds=Object.keys(by).sort().slice(-14),tk=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,6);
new Chart($('#c1'),{type:'bar',data:{labels:ds,datasets:[{label:'Ventas por día',data:ds.map(d=>by[d]),backgroundColor:S.cfg.color}]},options:op});
new Chart($('#c2'),{type:'doughnut',data:{labels:tk.map(x=>x[0]),datasets:[{label:'Unidades',data:tk.map(x=>x[1])}]},options:op})}
function xl(){const w=XLSX.utils.book_new(),a=(n,r)=>XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(r),n),by={};
S.orders.forEach(o=>by[o.d]=(by[o.d]||0)+o.tot);
a('Productos',S.prods.map(({img,...r})=>r));a('Pedidos',S.orders.map(o=>({...o,items:o.items.map(i=>i.q+'x '+i.n).join('; ')})));
a('VentasPorDia',Object.keys(by).sort().map(d=>({Fecha:d,Total:by[d]})));XLSX.writeFile(w,'catalogo_'+new Date().toISOString().slice(0,10)+'.xlsx')}
(async()=>{if(API)try{const n=await(await fetch(API)).json();if(n.prods)S=n}catch(e){}shop()})();
</script></body></html>
